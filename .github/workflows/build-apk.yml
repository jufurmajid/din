name: Build Professional APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable multi-file backup import
        run: python3 .github/scripts/enable_multi_backup_import.py

      - name: Apply professional rebrand
        run: python3 .github/scripts/professional_rebrand.py

      - name: Apply complete export-all fix
        run: python3 .github/scripts/fix_export_all.py

      - name: Verify old branding is gone
        run: |
          if grep -RIniE 'blusher|كوزمتك|cosmetic' app/src/main app/build.gradle.kts; then
            echo "Old branding is still present"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Restore original v2 signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing-source
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11243212079/zip" > signing-source.zip
          unzip -j signing-source.zip "daftar-deyoon-release.jks" "signing-info.txt" -d signing-source
          test -s signing-source/daftar-deyoon-release.jks
          PASS=$(sed -n 's/^[[:space:]]*Keystore password:[[:space:]]*//p' signing-source/signing-info.txt | head -n1)
          test -n "$PASS"
          echo "::add-mask::$PASS"
          echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle clean assembleRelease --stacktrace

      - name: Align, sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          FINAL="app/build/outputs/apk/release/Daftar-Deyoon-v2.1.apk"
          KEYSTORE="signing-source/daftar-deyoon-release.jks"
          VERIFY="app/build/outputs/apk/release/verification-v2.1.txt"

          test -f "$UNSIGNED"
          test -f "$KEYSTORE"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias daftar-deyoon \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --key-pass "pass:$KEYSTORE_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL" | tee "$VERIFY"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL" | tee -a "$VERIFY"
          "$BUILD_TOOLS/aapt" dump badging "$FINAL" | tee -a "$VERIFY"
          "$BUILD_TOOLS/aapt" dump permissions "$FINAL" | tee -a "$VERIFY"

          grep -q "package: name='com.jafarmajid.debtbook' versionCode='3' versionName='2.1'" "$VERIFY"
          grep -q "application-label:'دفتر ديون'" "$VERIFY"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$VERIFY"
          grep -q "Signer #1 certificate SHA-256 digest: 94d109f70d69ca4fc718cc4e62b539103cd7eddb602ffddaf7b53053f93b2328" "$VERIFY"

          if unzip -p "$FINAL" classes.dex classes2.dex classes3.dex classes4.dex 2>/dev/null | strings | grep -qiE 'blusher|كوزمتك|cosmetic'; then
            echo "Old branding found inside compiled APK" | tee -a "$VERIFY"
            exit 1
          fi

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-Deyoon-v2.1-export-fix
          path: |
            app/build/outputs/apk/release/Daftar-Deyoon-v2.1.apk
            app/build/outputs/apk/release/verification-v2.1.txt
          if-no-files-found: error
          retention-days: 30
